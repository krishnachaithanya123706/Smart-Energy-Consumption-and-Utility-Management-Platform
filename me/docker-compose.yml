services:

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: smart-energy-backend
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: smart-energy-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped