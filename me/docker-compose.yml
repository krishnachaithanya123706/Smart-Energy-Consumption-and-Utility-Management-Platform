services:

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: smart-energy-backend
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: smart-energy-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  jenkins:
    build:
      context: .
      dockerfile: jenkins.Dockerfile
    container_name: smart-energy-jenkins
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home: