<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Energy & Utility Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header class="site-header">
    <h1>Smart Energy Consumption and Utility Management Platform</h1>
    <p>Smart City Utility Monitoring Dashboard</p>
</header>
<main class="dashboard">
    <section class="metric-grid" aria-label="Consumption summary">
        <article class="metric-card"><h2>Total Consumption</h2><p id="total">0.00</p></article>
        <article class="metric-card"><h2>Electricity</h2><p id="electricity">0.00</p></article>
        <article class="metric-card"><h2>Water</h2><p id="water">0.00</p></article>
        <article class="metric-card"><h2>Gas</h2><p id="gas">0.00</p></article>
    </section>
    <section class="record-panel">
        <h2>Add Consumption Record</h2>
        <form id="consumptionForm" class="record-form">
            <input type="text" id="consumer" placeholder="Consumer Name" required>
            <select id="utility" required><option value="" disabled selected>Select Utility</option><option>Electricity</option><option>Water</option><option>Gas</option></select>
            <input type="number" id="consumption" placeholder="Consumption" step="0.01" min="0" required>
            <input type="text" id="unit" placeholder="Unit" required>
            <input type="date" id="date" required>
            <button type="submit">Add Record</button>
        </form>
    </section>
    <section class="records-panel">
        <h2>Recent Consumption Records</h2>
        <div class="table-wrap"><table><thead><tr><th>ID</th><th>Consumer</th><th>Utility</th><th>Consumption</th><th>Unit</th><th>Date</th></tr></thead><tbody id="records"></tbody></table></div>
    </section>
</main>
<script src="script.js"></script>

</body>
</html>
